<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعادة ضبط الذاكرة وتشغيل لوحة التحكم</title>
    <style>
        body { font-family: sans-serif; background: #080c24; color: #fff; text-align: center; padding: 50px; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 12px; display: inline-block; }
        .btn { background: #00d2ff; color: #000; padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ تم تنظيف ذاكرة المتصفح المؤقتة بنجاح</h2>
        <p>جاري توجيهك تلقائياً إلى لوحة التحكم الرئيسية...</p>
        <a href="index.html" class="btn">الانتقال المباشر إلى لوحة التحكم</a>
    </div>
    <script>
        try {
            localStorage.clear();
            sessionStorage.clear();
        } catch(e) {}
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1200);
    </script>
</body>
</html>
